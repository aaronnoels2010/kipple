[package]
name = "kipple-index"
description = "SQLite storage: index.db (rebuildable cache) and state.db (journal, marks, tags)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
kipple-core = { path = "../kipple-core" }
# Bundled SQLite: the same version, with FTS5 (trigram), on every OS.
rusqlite = { version = "=0.40.2", features = ["bundled"] }

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true
