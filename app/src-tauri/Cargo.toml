[package]
name = "kipple-app"
description = "Kipple's Tauri shell: wires the engine to the UI. Holds no business logic."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "kipple_app"
path = "src/lib.rs"

[[bin]]
name = "kipple"
path = "src/main.rs"

[build-dependencies]
tauri-build = "=2.7.1"

[dependencies]
tauri = "=2.12.1"
tauri-plugin-opener = "=2.7.0"
tauri-plugin-single-instance = "=2.5.2"

[dev-dependencies]
serde_json = "=1.0.154"

[lints]
workspace = true
