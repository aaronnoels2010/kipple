[package]
name = "kipple-app"
description = "Kipple's Tauri shell: wires the engine to the UI. Holds no business logic."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "kipple_app"
path = "src/lib.rs"

[[bin]]
name = "kipple"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
kipple-core = { path = "../../crates/kipple-core" }
kipple-engine = { path = "../../crates/kipple-engine" }
kipple-index = { path = "../../crates/kipple-index" }
kipple-platform = { path = "../../crates/kipple-platform" }
tauri = { version = "=2.12.1", features = [] }
tauri-plugin-dialog = "=2.8.1"
tauri-plugin-opener = "=2.7.0"
tauri-plugin-single-instance = "=2.5.2"
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.154"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
sys-locale = "=0.3.2"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive"] }
# Logging with redacted paths (logging.rs, redact.rs)
getrandom = "=0.4.3"
hmac = "=0.13.0"
sha2 = "=0.11.0"
tracing = "=0.1.44"
tracing-appender = "=0.2.5"
tracing-log = "=0.2.0"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "registry", "std"] }

[dev-dependencies]
# Tauri's mock runtime, for tests that need an app (portable.rs).
tauri = { version = "=2.12.1", features = ["test"] }
log = "=0.4.34"
tempfile = "=3.27.0"
# The TypeScript export only runs in the bindings test, never in the app.
tauri-specta = { version = "=2.0.0-rc.25", features = ["typescript"] }
specta-typescript = "=0.0.12"

[lints]
workspace = true
