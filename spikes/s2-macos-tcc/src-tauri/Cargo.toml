[package]
name = "kipple-spike-tcc"
version = "0.0.1"
description = "Spike S2 (K-0.3): do macOS folder permissions survive updates of an unsigned Kipple? Throwaway."
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

# Standalone: never part of the main Cargo workspace.
[workspace]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = [] }
serde = { version = "1", features = ["derive"] }

[profile.release]
strip = true
