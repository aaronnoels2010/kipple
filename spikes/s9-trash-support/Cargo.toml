[package]
name = "kipple-spike-trashprobe"
version = "0.0.1"
description = "Spike S9 (K-0.6): which volumes have a Trash, and can Kipple predict it before deleting? Throwaway."
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

# Standalone: never part of the main Cargo workspace.
[workspace]

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSFileManager", "NSURL", "NSError", "NSString", "NSPathUtilities"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
trash = "=5.2.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_Shell"] }
